services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: battleface
      POSTGRES_USER: battleface
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before running docker compose}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battleface -d battleface"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend/Dockerfile
    working_dir: /app
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:?Set APP_KEY before running docker compose}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: http://localhost:8001
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: battleface
      DB_USERNAME: battleface
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before running docker compose}
      QUOTATION_JWT_SECRET: ${QUOTATION_JWT_SECRET:?Set QUOTATION_JWT_SECRET before running docker compose}
      QUOTATION_DEMO_EMAIL: demo@battleface.test
      QUOTATION_DEMO_PASSWORD: ${QUOTATION_DEMO_PASSWORD:?Set QUOTATION_DEMO_PASSWORD before running docker compose}
      QUOTATION_COOKIE_SECURE: "false"
      QUOTATION_EUR_RATE: "1.0"
      QUOTATION_GBP_RATE: "0.86"
      QUOTATION_USD_RATE: "1.09"
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor

  frontend:
    image: node:20
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -lc "npm install && npm start -- --host 0.0.0.0 --proxy-config proxy.conf.json"
    depends_on:
      - backend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_vendor:
  frontend_node_modules:
  postgres_data:
