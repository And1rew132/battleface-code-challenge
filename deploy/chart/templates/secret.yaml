{{- if not .Values.backend.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "battleface.backendSecretName" . }}
  namespace: {{ include "battleface.namespace" . }}
  labels:
    {{- include "battleface.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ required "backend.appKey is required" .Values.backend.appKey | quote }}
  QUOTATION_JWT_SECRET: {{ required "backend.jwtSecret is required" .Values.backend.jwtSecret | quote }}
  QUOTATION_DEMO_PASSWORD: {{ required "backend.demoPassword is required" .Values.backend.demoPassword | quote }}
---
{{- end }}
{{- if and .Values.postgres.enabled (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "battleface.postgresSecretName" . }}
  namespace: {{ include "battleface.namespace" . }}
  labels:
    {{- include "battleface.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  database: {{ .Values.postgres.database | quote }}
  username: {{ .Values.postgres.username | quote }}
  password: {{ required "postgres.password is required" .Values.postgres.password | quote }}
{{- end }}
