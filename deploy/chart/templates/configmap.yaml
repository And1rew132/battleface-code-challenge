apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "battleface.name" . }}-config
  namespace: {{ include "battleface.namespace" . }}
  labels:
    {{- include "battleface.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: {{ printf "https://%s" .Values.host | quote }}
  DB_CONNECTION: pgsql
  DB_HOST: {{ include "battleface.name" . }}-postgres
  DB_PORT: "5432"
  DB_DATABASE: {{ .Values.postgres.database | quote }}
  DB_USERNAME: {{ .Values.postgres.username | quote }}
  CORS_ALLOWED_ORIGINS: {{ printf "https://%s" .Values.host | quote }}
  RUN_MIGRATIONS: {{ .Values.backend.runMigrations | quote }}
  RUN_SEEDERS: {{ .Values.backend.runSeeders | quote }}
  QUOTATION_DEMO_EMAIL: {{ .Values.backend.demoEmail | quote }}
  QUOTATION_EUR_RATE: {{ .Values.backend.currencyRates.EUR | quote }}
  QUOTATION_GBP_RATE: {{ .Values.backend.currencyRates.GBP | quote }}
  QUOTATION_USD_RATE: {{ .Values.backend.currencyRates.USD | quote }}
